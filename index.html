<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POPSICLE - 3D Product Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #0f0f11;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 畫布容器（固定全螢幕背景） */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* 滾動內容層 */
        .content {
            position: relative;
            z-index: 2;
            pointer-events: none; /* 讓滑鼠事件能穿透到 3D 畫布 */
        }

        section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10vw;
        }

        /* 標題與內文樣式 */
        .hero-title {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 15px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: #88888e;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .desc-box {
            max-width: 400px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .desc-box h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #ff5e7e;
        }

        .desc-box p {
            color: #aaa;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* 局部對齊調整 */
        .section-right {
            align-items: flex-end;
            text-align: right;
        }

        .section-center {
            align-items: center;
            text-align: center;
        }

        /* 載入中指示器 */
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #fff;
            z-index: 10;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="loader">LOADING 3D MODEL...</div>
    <div id="canvas-container"></div>

    <div class="content">
        <!-- 區塊 1: 主標題 -->
        <section class="section-center">
            <h1 class="hero-title">POPSICLE</h1>
            <p class="subtitle">THE ULTIMATE SUMMER REFRESHMENT1</p>
        </section>

        <!-- 區塊 2: 產品特點 (左) -->
        <section>
            <div class="desc-box">
                <h3>Crafted Precision</h3>
                <p>每個角落皆經過精細雕琢，搭配流線型的幾何造型與色彩呈現，打破傳統冰棒的想像界限。</p>
            </div>
        </section>

        <!-- 區塊 3: 材質細節 (右) -->
        <section class="section-right">
            <div class="desc-box">
                <h3>Premium Ingredients</h3>
                <p>採用高質感材質渲染與透光材質，呈現極致誘人的晶瑩質感與清涼體驗。</p>
            </div>
        </section>

        <!-- 區塊 4: 結尾展示 -->
        <section class="section-center">
            <h2 style="font-size: 3rem; letter-spacing: 6px;">EXPLORE MORE</h2>
        </section>
    </div>

    <!-- 引入 Three.js 與 GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // 1. 場景設定
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // 相機
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // 2. 光源設定 (類似 FS 60P 的專業影棚光)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 2);
        dirLight1.position.set(5, 10, 7);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xff5e7e, 1.5); // 帶一點冰棒主題色偏光
        dirLight2.position.set(-5, -5, -5);
        scene.add(dirLight2);

        // 3. 載入 popsicle.glb 模型
        let model;
        const loader = new THREE.GLTFLoader();
        
        loader.load(
            './popsicle.glb',
            (gltf) => {
                model = gltf.scene;
                
                // 自動居中並調整比例
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y);
                model.position.z += (model.position.z - center.z);

                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2.2 / maxDim;
                model.scale.set(scale, scale, scale);

                scene.add(model);

                // 隱藏 Loading
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
            },
            (xhr) => {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('loader').innerText = `LOADING 3D MODEL... ${percent}%`;
            },
            (error) => {
                console.error('模型載入失敗:', error);
                document.getElementById('loader').innerText = '載入模型失敗，請確認檔案路徑是否為 ./popsicle.glb';
            }
        );

        // 4. 滾動與滑鼠互動動畫
        let scrollY = 0;
        let mouseX = 0;
        let mouseY = 0;

        window.addEventListener('scroll', () => {
            scrollY = window.scrollY;
        });

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 0.5;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 0.5;
        });

        // 5. 動畫循環 (Render Loop)
        function animate() {
            requestAnimationFrame(animate);

            if (model) {
                // 計算滾動進度 (0 ~ 1)
                const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                const scrollProgress = Math.min(Math.max(scrollY / maxScroll, 0), 1);

                // 根據滾動位置調整模型姿態 (旋轉 & 偏移)
                const targetRotationX = scrollProgress * Math.PI * 2 + mouseY;
                const targetRotationY = scrollProgress * Math.PI * 3 + mouseX;
                const targetPositionY = Math.sin(scrollProgress * Math.PI * 2) * 0.3;

                // 平滑插值 (Lerp) 讓動作流暢
                model.rotation.x += (targetRotationX - model.rotation.x) * 0.05;
                model.rotation.y += (targetRotationY - model.rotation.y) * 0.05;
                model.position.y += (targetPositionY - model.position.y) * 0.05;

                // 抓取物件並限制微量位移，確保不超出畫面
                const bear = model.getObjectByName('Bear_Up-1.001');
                const stick = model.getObjectByName('木柄');

                // 縮小係數至 0.08，既有微幅拆解質感，又不會讓木柄掉出螢幕外
                if (bear) bear.position.y = scrollProgress * 0.08;
                if (stick) stick.position.y = -scrollProgress * 0.08;
            }

            renderer.render(scene, camera);
        }

        animate();

        // 6. 視窗大小改變自適應
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
